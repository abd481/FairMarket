name: FairMarket
prefect-version: 3.7.0

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/abd481/FairMarket
      branch: main
  - prefect.deployments.steps.run_shell_script:
      script: pip install "poetry==2.3.2"
      directory: FairMarket-main
  - prefect.deployments.steps.run_shell_script:
      script: poetry config virtualenvs.create false
      directory: FairMarket-main
  - prefect.deployments.steps.run_shell_script:
      script: poetry install --no-interaction --only main
      directory: FairMarket-main
  - prefect.deployments.steps.run_shell_script:
      script: python3 -m pip install joblib
      directory: FairMarket-main
  - prefect.deployments.steps.run_shell_script:
      script: poetry run playwright install --with-deps firefox
      directory: FairMarket-main

deployments:
  - name: data_pipeline
    version: null
    tags: []
    concurrency_limit: null
    description: null
    entrypoint: pipeline/main.py:main
    parameters: {}
    work_pool:
      name: data-pipeline-pool
      work_queue_name: null
      job_variables: {}
    schedules:
      - cron: 0 12 * * *
        timezone: Africa/Cairo
        day_or: true
        active: true
