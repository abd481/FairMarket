name: Real estate Project
prefect-version: 3.7.0

build: null
push: null

pull:
  - prefect.deployments.steps.git_clone:
      repository: https://github.com/abd481/Real-estate-end-to-end-System-
      branch: main
      access_token: '{{ prefect.blocks.secret.deployment-data-pipeline-real-estate-pipeline-repo-token }}'
  - prefect.deployments.steps.run_shell_script:
      script: pip install "poetry==2.3.2"
      directory: Real-estate-end-to-end-System--main
  - prefect.deployments.steps.run_shell_script:
      script: poetry config virtualenvs.create false
      directory: Real-estate-end-to-end-System--main
  - prefect.deployments.steps.run_shell_script:
      script: poetry install --no-interaction
      directory: Real-estate-end-to-end-System--main

deployments:
  - name: data_pipeline
    version: null
    tags: []
    concurrency_limit: null
    description: null
    entrypoint: pipeline/main.py:main
    parameters: {}
    work_pool:
      name: data-pipeline-pool
      work_queue_name: null
      job_variables: {}
    schedules:
      - cron: 0 12 * * *
        timezone: Africa/Cairo
        day_or: true
        active: true
