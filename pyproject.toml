[project]
name = "real-estate-ml-system"
version = "0.1.0"
description = "A Production ML System for the Egyptian Market"
authors = [
    {name = "Abdelrahman Sayed", email = "abdelrahmansayd198@gmail.com"}
]
requires-python = ">=3.11"
dependencies = [
    "requests (>=2.33.1,<3.0.0)",
    "httpx[http2] (>=0.28.1,<0.29.0)",
    "playwright (>=1.58.0,<2.0.0)",
    "pandas (>=3.0.2,<4.0.0)",
    "playwright-stealth (>=2.0.3,<3.0.0)"
]

[dependency-groups]
dev = [
    "black (>=26.3.1,<27.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"