[project]
name = "real-estate-pipeline"
version = "0.1.0"
description = "A Production ML System for the Egyptian Market"
authors = [
    {name = "Abdelrahman Sayed", email = "abdelrahmansayd198@gmail.com"}
]
requires-python = ">=3.11,<3.15"

[tool.poetry]
name = "real-estate-pipeline"
version = "0.1.0"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
requests = ">=2.33.1,<3.0.0"
httpx = {extras = ["http2"], version = ">=0.28.1,<0.29.0"}
playwright = ">=1.58.0,<2.0.0"
pandas = ">=3.0.2,<4.0.0"
playwright-stealth = ">=2.0.3,<3.0.0"
psycopg2-binary = ">=2.9.12,<3.0.0"
ipykernel = ">=7.2.0,<8.0.0"
sqlalchemy = ">=2.0.49,<3.0.0"
prefect = ">=3.7.6"
pymongo = ">=4.15.0,<5.0.0"
python-dotenv = ">=1.2.0,<2.0.0"
pydantic = ">=2.12.0,<3.0.0"
joblib = "^1.5.3"
scikit-learn = ">=1.6.0"
numpy = ">=2.0.0"

[tool.poetry.group.dev.dependencies]
black = ">=26.3.1,<27.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"